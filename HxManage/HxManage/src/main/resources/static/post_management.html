<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>帖子管理</title>
    <link href="./layui-v2.9.13/layui/css/layui.css" rel="stylesheet">
    <style>

        .layui-container {
            padding: 20px;
        }

        /* 自定义操作按钮样式 */
        .layui-btn-container {
            margin-bottom: 10px;
        }

        /* 调整按钮间距 */
        .layui-btn + .layui-btn {
            margin-left: 10px;
        }

        /* 搜索框样式 */
        .layui-input-inline {
            vertical-align: middle;
        }
    </style>
</head>

<body>
<div class="layui-container">
    <!-- 用户管理内容标题 -->
    <div class="layui-row">
        <div class="layui-col-md12">
            <!--            <div style="text-align: center; color: #1E9FFF; font-size: 15px; margin-bottom: 15px;">用户管理</div>-->
        </div>
    </div>

    <!-- 用户管理详细信息表格 -->
    <div class="layui-row">
        <div class="layui-col-md12">
            <div class="layui-card layui-panel">
                <div class="layui-card-body">
                    <!-- 表格容器 -->
                    <table class="layui-table" id="post-table" lay-filter="post-table"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 引入依赖的 JavaScript 库 -->
<script src="./jquery/jquery.js"></script>
<script src="./layui-v2.9.13/layui/layui.js"></script>
<script>
    layui.use(['table', 'layer', 'jquery'], function () {
        var table = layui.table;
        var layer = layui.layer;
        var $ = layui.jquery;

        // 渲染表格
        table.render({
            elem: '#post-table',
            url: '/api/post/getPostAll',
            method: 'get', // 请求方式，默认为 'get'
            parseData: function (res) { // res 即为原始返回的数据
                return {
                    "code": res.code === 200 ? 0 : res.code, // 解析接口状态，确保返回 code 0 为成功
                    "msg": res.message, // 解析提示文本
                    "count": res.data.total, // 解析数据总数
                    "data": res.data.records // 解析数据列表
                };
            },
            page: true, // 开启分页
            limits: [10, 20, 30, 50, 100], // 每页显示的条数可选项
            limit: 10, // 每页默认显示的条数
            toolbar: `
                <div class="layui-btn-container">
                    <!-- 搜索框 -->
                    <div class="layui-input-inline">
                        <input type="text" id="post-searchById" name="post-searchById" placeholder="请输入帖子ID" autocomplete="off" class="layui-input">
                    </div>
                    <button type="button" class="layui-btn layui-btn-warm" lay-event="searchById">搜索</button>
                    <button type="button" class="layui-btn layui-btn-primary" lay-event="removeAllById">重置</button>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <div class="layui-input-inline">
                        <input type="text" id="post-search" name="post-search" placeholder="请输入帖子正文关键字" autocomplete="off" class="layui-input">
                    </div>
                    <button type="button" class="layui-btn layui-btn-warm" lay-event="search">搜索</button>
                    <button type="button" class="layui-btn layui-btn-primary" lay-event="removeAll">重置</button>
                </div>
            `,
            // 表格头部工具栏的选择器

            cols: [[ // 表头
                {field: 'postId', title: '帖子ID', width: 100, fixed: 'left'},
                {field: 'userId', title: '发帖用户', width: 120},
                {field: 'caption', title: '帖子正文', width: 120},
                {field: 'location', title: '发帖位置', width: 155},
                {
                    field: 'createdAt', title: '发帖时间', width: 160, templet: function (d) {
                        return layui.util.toDateString(d.createdAt, 'yyyy-MM-dd HH:mm:ss')
                    }
                },
                {
                    field: 'updatedAt', title: '更新时间', width: 160, templet: function (d) {

                        return layui.util.toDateString(d.createdAt, 'yyyy-MM-dd HH:mm:ss')
                    }
                },
                {field: 'likesCount', title: '点赞数', width: 80},
                {field: 'commentsCount', title: '评论数', width: 80},
                {field: 'favoriteCount', title: '收藏数', width: 80},
                {
                    title: '帖子是否下架', width: 150, templet: function (d) {
                        return d.deleted === true ? '<span class="layui-badge layui-bg-red">已下架</span>' :
                            '<span class="layui-badge layui-bg-blue">未下架</span>';
                    }
                },
                {fixed: 'right', title: '操作', toolbar: '#barDemo', width: 120} // 操作列
            ]],

            where: {}
        });

        // 自定义状态模板
        layui.laytpl.config({
            open: '{{',
            close: '}}'
        });

        // 监听表格头工具栏的事件
        table.on('toolbar(post-table)', function (obj) {
            if (obj.event === 'search') {
                var postName = $('#post-search').val();
                console.log('搜索', postName);
                // 重新加载表格数据
                if (postName === '') {
                    layer.msg('请输入搜索内容');
                    return;
                }
                table.reload('post-table', {
                    url: '/api/post/serchPost',
                    where: {
                        postName: postName
                    },
                    page: {
                        curr: 1 // 从第一页重新加载
                    }
                });
            } else if (obj.event === 'removeAll') {
                console.log('重置');
                // 清空搜索框
                $('#post-search').val('');
                // 重新加载表格数据
                table.reload('post-table', {
                    url: '/api/post/getPostAll', // 恢复到获取所有用户数据的接口
                    where: {},
                    page: {
                        curr: 1 // 从第一页重新加载
                    }
                });
            }
            if(obj.event === 'searchById'){
                var postId = $('#post-searchById').val();
                console.log('搜索', postId);
                // 重新加载表格数据
                if (postId === '') {
                    layer.msg('请输入帖子Id');
                    return;
                }
                table.reload('post-table', {
                    url: '/api/post/serchPostById',
                    where: {
                        postId: postId
                    },
                    // 返回值只有一条数据，所以不需要分页
                    page: {
                        curr: 1 // 从第一页重新加载
                    }
                });
            } else if (obj.event === 'removeAllById') {
                console.log('重置');
                // 清空搜索框
                $('#post-searchById').val('');
                // 重新加载表格数据
                table.reload('post-table', {
                    url: '/api/post/getPostAll', // 恢复到获取所有用户数据的接口
                    where: {},
                    page: {
                        curr: 1 // 从第一页重新加载
                    }
                });
            }
        });
        // 监听表格操作列的事件
        table.on('tool(post-table)', function (obj) {
            var data = obj.data;
            if (obj.event === 'del') {
                layer.confirm('确定下架该帖子吗？', function (index) {
                    layer.close(index);  // 关闭弹框
                    if (data.deleted === true) {
                        layer.msg('该帖子已下架', {icon: 2});
                        return;
                    }
                    $.ajax({
                        url: '/api/post/removePost',
                        type: 'post',
                        data: {
                            postId: data.postId
                        },
                        success: function (res) {
                            if (res.code === 200) {
                                layer.msg('下架成功');
                                table.reload('post-table'); // 重载表格数据
                            } else {
                                layer.msg('下架失败，' + res.message);
                            }
                        },
                        error: function (err) {
                            layer.msg('下架失败，' + err.message);
                        }
                    });
                });
            } else if (obj.event === 'unlock') {
                console.log('解除帖子');
                layer.confirm('确定解除该帖子吗吗？', function (index) {
                    layer.close(index);  // 关闭弹框
                    if (data.deleted === false) {
                        layer.msg('该帖子未下架', {icon: 2});
                        return;
                    }
                    $.ajax({
                        url: '/api/post/unlockPost',
                        type: 'post',
                        data: {
                            postId: data.postId
                        },
                        success: function (res) {
                            if (res.code === 200) {
                                layer.msg('解除成功');
                                table.reload('post-table'); // 重载表格数据
                            } else {
                                layer.msg('解除失败，' + res.message);
                            }
                        },
                        error: function (err) {
                            layer.msg('解除失败，' + err.message);
                        }
                    });
                });
            }
        });
    });
</script>

<!-- 操作列的模板 -->
<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-radius layui-btn-xs" lay-event="del">下架</a>
    <a class="layui-btn layui-btn-radius layui-btn-xs" lay-event="unlock">解除</a>
</script>
</body>

</html>
