<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录界面</title>
    <link rel="stylesheet" href="./layui-v2.9.13/layui/css/layui.css">
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 400px;
            margin: 100px auto;
            padding: 40px;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            transition: box-shadow 0.3s;
        }

        .login-container:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .layui-form-item .layui-input {
            height: 45px;
            line-height: 45px;
        }

        .captcha-btn {
            width: 120px;
            height: 45px;
            line-height: 45px;
            margin-left: 10px;
            transition: background-color 0.3s;
        }

        .captcha-btn:hover {
            background-color: #1E9FFF;
            color: white;
        }

        .login-btn {
            width: 100%;
            background-color: #1E9FFF;
            color: white;
            height: 45px;
            line-height: 45px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #1085d5;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>HX-APP管理系统 登录</h2>
    <form class="layui-form" action="">
        <!-- 账号输入框 -->
        <div class="layui-form-item">
            <label class="layui-form-label">账号</label>
            <div class="layui-input-block">
                <input type="text" name="username" required lay-verify="required" placeholder="请输入账号"
                       autocomplete="off" class="layui-input">
            </div>
        </div>
        <!-- 密码输入框 -->
        <div class="layui-form-item">
            <label class="layui-form-label">密码</label>
            <div class="layui-input-block">
                <input type="password" name="password" required lay-verify="required" placeholder="请输入密码"
                       autocomplete="off" class="layui-input">
            </div>
        </div>

        <!-- 手机号码输入框 -->
        <div class="layui-form-item">
            <label class="layui-form-label">手机号码</label>
            <div class="layui-input-block">
                <div style="display: flex;">
                    <input type="text" name="phone" required lay-verify="phone" placeholder="请输入手机号码"
                           autocomplete="off" class="layui-input" style="flex: 1;">
                    <button type="button" class="layui-btn captcha-btn" onclick="sendCaptcha()">发送验证码</button>
                </div>
            </div>
        </div>
        <!-- 手机验证码输入框 -->
        <div class="layui-form-item">
            <label class="layui-form-label">验证码</label>
            <div class="layui-input-block">
                <input type="text" name="captcha" required lay-verify="required" placeholder="请输入验证码"
                       autocomplete="off" class="layui-input">
            </div>
        </div>
        <!-- 登录按钮 -->
        <div class="layui-form-item">
            <button type="submit" class="layui-btn login-btn" lay-submit lay-filter="login">登录</button>
        </div>
    </form>
    <div class="footer">© HX-APP管理系统</div>
</div>

<script src="./layui-v2.9.13/layui/layui.js"></script>
<script src="jquery/jquery.js"></script>
<script src="js/global.js"></script>
<script>
    layui.use(['form'], function () {
        var form = layui.form;

        // 提交监听
        form.on('submit(login)', function (data) {
            layer.msg('登录中，请稍后...', {icon: 16, time: 0});
            console.log('登录数据：', data.field);
            $.ajax({
                url: 'api/login/login',
                type: 'post',
                contentType: 'application/json',
                data: JSON.stringify(data.field),
                success: function (res) {
                    console.log(res);
                    if (res.code === 200) {
                        layer.msg(res.message, {icon: 1, time: 1500});
                        setTimeout(function () {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        layer.msg(res.message, {icon: 2, time: 1500});
                    }
                },
                error: function (err) {
                    console.log(err);
                    layer.msg('登录失败，请重试。', {icon: 2, time: 1500});
                }
            });
            return false; // 防止表单默认提交
        });
    });

    function sendCaptcha() {
        layui.layer.msg('验证码发送中！', {icon: 16, time: 0});
        var phone = $('input[name="phone"]').val();

        if (!/^\d{11}$/.test(phone)) {
            layui.layer.msg('请输入有效的手机号码！', {icon: 2, time: 2000});
            return;
        }

        $.ajax({
            url: 'api/sms/send',
            type: 'post',
            contentType: 'application/json',
            data: JSON.stringify({phone: phone}),
            success: function (res) {
                if (res.code === 200) {
                    layui.layer.msg('验证码发送成功！', {icon: 1, time: 2000});
                } else {
                    layui.layer.msg(res.message, {icon: 2, time: 2000});
                }
            },
            error: function (err) {
                layui.layer.msg('验证码发送失败！', {icon: 2, time: 2000});
            }
        });
    }
</script>

</body>
</html>
